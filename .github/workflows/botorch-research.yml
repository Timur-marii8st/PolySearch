name: BoTorch research validation
on:
  push:
    branches: [main]
    paths:
      - "polysearch/bo/botorch_*.py"
      - "polysearch/bo/replay.py"
      - "tests/test_research_bo.py"
      - "pyproject.toml"
      - ".github/workflows/botorch-research.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,ml,research]"
      - run: python -m pytest -q tests/test_research_bo.py
      - run: python -m polysearch.data.monash_source --subset mma
      - run: python -m polysearch.data.monash_etl --mapping data/monash/mapping.mma-v1.json --folds 5
      - run: python -m polysearch.bo.botorch_benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: botorch-research
          path: artifacts/botorch-research/
          retention-days: 30
