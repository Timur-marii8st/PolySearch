name: Scientific data planning
on:
  push:
    branches: [main]
    paths:
      - "polysearch/ml/data_planning.py"
      - "polysearch/ml/learning_benchmark.py"
      - "tests/test_data_planning.py"
      - "polysearch/ml/molecular*.py"
      - "polysearch/data/**"
      - "data/molecular/**"
      - ".github/workflows/data-planning.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,ml,molecular]"
      - run: python -m pytest -q tests/test_data_planning.py
      - run: python -m polysearch.data.monash_source --subset kinetics --root data/raw/monash-kinetics-v1
      - run: python -m polysearch.data.monash_multimonomer
      - run: python -m polysearch.data.raft_source
      - run: python -m polysearch.data.raft_etl
      - run: python -m polysearch.ml.learning_benchmark
      - run: python -m polysearch.ml.data_planning --request data/planning/example-budget.json --out artifacts/data-planning/example-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: scientific-data-planning
          path: artifacts/data-planning/
          retention-days: 30
