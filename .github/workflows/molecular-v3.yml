name: Molecular ML v3
on:
  push:
    branches: [main]
    paths:
      - "polysearch/ml/molecular*.py"
      - "tests/test_molecular*.py"
      - "tests/test_research_workbench.py"
      - "polysearch/ml/workbench.py"
      - "data/molecular/**"
      - "polysearch/data/monash_multimonomer.py"
      - "polysearch/data/raft_etl.py"
      - "pyproject.toml"
      - ".github/workflows/molecular-v3.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,ml,molecular]"
      - run: python -m pytest -q tests/test_molecular.py tests/test_research_workbench.py
      - run: python -m polysearch.data.monash_source --subset kinetics --root data/raw/monash-kinetics-v1
      - run: python -m polysearch.data.monash_multimonomer
      - run: python -m polysearch.data.raft_source
      - run: python -m polysearch.data.raft_etl
      - run: python -m polysearch.ml.molecular_benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: molecular-v3-report
          path: artifacts/molecular-v3/
          retention-days: 30
