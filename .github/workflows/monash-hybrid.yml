name: Monash hybrid scientific benchmark
on:
  push:
    branches: [main]
    paths:
      - "polysearch/ml/**"
      - "polysearch/bo/hybrid_replay.py"
      - "polysearch/bo/replay.py"
      - "polysearch/data/**"
      - "data/monash/**"
      - ".github/workflows/monash-hybrid.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[ml]"
      - run: python -m polysearch.data.monash_source --subset mma
      - run: python -m polysearch.data.monash_etl --mapping data/monash/mapping.mma-v1.json --folds 5
      - run: python -m polysearch.ml.hybrid_benchmark
      - run: python -m polysearch.bo.hybrid_replay
      - uses: actions/upload-artifact@v4
        with:
          name: monash-hybrid-benchmark
          path: |
            artifacts/monash-hybrid/
            artifacts/monash-hybrid-bo/
          retention-days: 30
