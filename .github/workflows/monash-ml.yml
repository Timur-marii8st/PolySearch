name: Monash ML benchmark
on:
  push:
    branches: [main]
    paths:
      - "polysearch/ml/**"
      - "polysearch/data/**"
      - "data/monash/mapping.mma-v1.json"
      - "pyproject.toml"
      - ".github/workflows/monash-ml.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monash-ml-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[ml]"
      - run: python -m polysearch.data.monash_source --subset mma
      - run: python -m polysearch.data.monash_etl --mapping data/monash/mapping.mma-v1.json --folds 5
      - run: python -m polysearch.ml.benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: monash-ml-benchmark
          path: |
            artifacts/monash-ml/report.json
            artifacts/monash-ml/oof_predictions.csv
            data/processed/monash-v1/quality.json
          retention-days: 30
