name: Monash source discovery
on:
  push:
    branches: [main]
    paths:
      - "polysearch/data/monash_source.py"
      - ".github/workflows/monash.yml"
      - "polysearch/data/monash_etl.py"
      - "data/monash/mapping.mma-v1.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -c 'from polysearch.data.monash_source import read_metadata; import json; m=read_metadata(); print("MONASH_RELEASE " + json.dumps({k:m.get(k) for k in ("id","version","doi","title","license","authors","files")},ensure_ascii=True))'
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m polysearch.data.monash_source --subset mma
      - run: python -m polysearch.data.monash_etl --mapping data/monash/mapping.mma-v1.json --folds 5
      - uses: actions/upload-artifact@v4
        with:
          name: monash-v1-mma-provisional
          path: |
            data/raw/monash-v1/manifest.json
            data/raw/monash-v1/inventory.json
            data/processed/monash-v1/mma_conversion.csv
            data/processed/monash-v1/rejected.csv
            data/processed/monash-v1/quality.json
          retention-days: 30
