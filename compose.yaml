services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: polysearch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    secrets:
      - db_admin_password
      - db_app_password
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d polysearch"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  app:
    build: .
    environment:
      POLYSEARCH_AUTH: required
      POLYSEARCH_POSTGRES_DSN: "dbname=polysearch host=db user=polysearch_app"
      POLYSEARCH_PG_PASSWORD_FILE: /run/secrets/db_app_password
      POLYSEARCH_ORIGIN: "${POLYSEARCH_ORIGIN:-http://127.0.0.1:8000}"
      POLYSEARCH_COOKIE_SECURE: "${POLYSEARCH_COOKIE_SECURE:-0}"
    secrets:
      - db_app_password
    ports:
      - "127.0.0.1:${POLYSEARCH_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  db_data:
secrets:
  db_admin_password:
    file: ./secrets/db_admin_password.txt
  db_app_password:
    file: ./secrets/db_app_password.txt
