<script id="project-data" type="application/json">{"project": "PolySearch", "version": "0.1.0", "direction": "№14 — планирование минимально достаточной серии синтезов", "description": "Интерактивная документация работающего локального демонстратора и следующего этапа разработки. Не панель управления реальной установкой.", "source_root": "(local source omitted)", "modules": [{"id": "data", "title": "Данные экспериментов", "status": "mixed", "subtitle": "CSV сегодня; Monash — следующий набор", "input": ["Результаты опытов в CSV", "Ручной ввод parameters / outcomes", "Демонстрационная синтетическая история"], "output": ["Проверенные записи trials", "Роли train и calibration", "Статусы completed и failed"], "implemented": ["Импорт CSV по именам факторов и свойств из конфигурации.", "Каждая завершённая запись обязана содержать все целевые свойства.", "Импорт всего файла атомарный: одна ошибочная строка отменяет запись всей партии.", "Экспорт CSV и снимка проекта JSON."], "planned": ["ETL Monash для одного мономера: температура, CT/CM и время пребывания → конверсия.", "Сохранение исходного experiment_id, единиц, протокола, источника, версии данных.", "Согласование измерений NMR и GPC; затем Mn и дисперсность Đ.", "Частично измеренные свойства потребуют изменения текущего контракта API."], "files": [{"path": "polymer_lab/api.py", "symbol": "csv_trials, import_csv, export_csv, export_json"}, {"path": "examples/synthetic_history.csv", "symbol": "12 синтетических обучающих записей"}], "fact_note": "Monash ещё не загружен в MVP. Временные точки одной кинетической кривой нельзя считать независимыми синтезами. CT/CM — отношение агента переноса цепи к мономеру; это не доля инициатора.", "purpose": "Этот слой превращает файлы и ручные записи в единый журнал экспериментов. В первой версии работает универсальный CSV-импорт; для первого научного сценария выберем один мономер из Monash и сначала будем прогнозировать конверсию.", "steps": [{"title": "Выбрать экспериментальную единицу", "body": "Для Monash заранее фиксируем, что считается независимым опытом и какой endpoint предсказываем. Точки одной кинетической кривой сохраняют общий experiment_id; они не превращаются в десятки независимых синтезов."}, {"title": "Сопоставить колонки", "body": "В текущем MVP имена колонок точно совпадают с name факторов и свойств в конфигурации. Служебные status и role задают пригодность результата для обучения или калибровки."}, {"title": "Проверить всю партию", "body": "csv_trials сначала разбирает и проверяет все строки. Состояние сохраняется лишь после успешной обработки файла, поэтому ошибка в последней строке не оставит частично загруженную историю."}, {"title": "Сохранить происхождение данных", "body": "Следующая доработка — неизменяемые raw-файлы и manifest с источником, лицензией, единицами, хешами и правилами обработки. Сейчас CSV-импорт присваивает новые внутренние ID и не переносит полное происхождение исходных записей."}], "snippet": "def csv_trials(config, text):\n    stream = io.StringIO(text.lstrip(\"\\ufeff\"))\n    reader = csv.DictReader(stream)\n    if not reader.fieldnames:\n        raise ValueError(\"CSV пуст или не содержит заголовков\")\n    if len(set(reader.fieldnames)) != len(reader.fieldnames):\n        raise ValueError(\"В CSV повторяются имена колонок\")", "snippetLabel": "Действующий разбор CSV: заголовок и дубликаты колонок", "snippetFile": "polymer_lab/api.py · csv_trials", "acceptance": ["В ETL каждая итоговая запись прослеживается до исходного файла и experiment_id.", "Разбиение train/test не разделяет одну кинетическую кривую между выборками.", "Отчёт импорта показывает число принятых и исключённых записей с причинами."], "related": ["schema", "gp", "evaluation", "roadmap"], "refs": [{"title": "Monash · исходный набор экспериментов", "url": "https://doi.org/10.26180/29208134.v1"}, {"title": "Статья о наборе Monash", "url": "https://doi.org/10.1039/D5RE00264H"}]}, {"id": "schema", "title": "Схема и качество", "status": "implemented", "subtitle": "Согласованный контракт эксперимента", "input": ["Конфигурация проекта", "Параметры и измерения"], "output": ["Валидные конечные числа", "Согласованные границы", "Понятная ошибка 422 при некорректном вводе"], "implemented": ["Pydantic запрещает лишние поля, NaN и бесконечность.", "Имена факторов и свойств уникальны, не конфликтуют со служебными полями CSV.", "От 1 до 12 факторов; от 1 до 8 свойств; до 30 линейных ограничений.", "Нижняя граница фактора строго меньше верхней; у свойства задана хотя бы одна целевая граница.", "Для completed нужны все измерения; failed не может иметь роль calibration."], "planned": ["Проверка единиц измерения и преобразование единиц.", "Контроль происхождения, дубликатов и групп экспериментов.", "Метки качества, протоколы измерения и причины неуспеха."], "files": [{"path": "polymer_lab/api.py", "symbol": "StrictModel, ProjectConfig, validate_result"}, {"path": "polymer_lab/engine.py", "symbol": "_spec, _parameters, _trials"}], "purpose": "Единый контракт удерживает параметры, свойства и ограничения согласованными на всех этапах. Проверки ловят структурные и численные ошибки до того, как они попадут в историю или обучение; химический смысл данных требует отдельного протокола.", "steps": [{"title": "Задать конфигурацию", "body": "ProjectConfig описывает управляемые factors, измеряемые targets, целевые границы, единицы и линейные ограничения. Допускаются односторонние требования к свойству, например только нижняя граница."}, {"title": "Проверить имена и числа", "body": "Pydantic запрещает неизвестные поля, неконечные значения и некорректные имена. Имена всех факторов и свойств должны быть уникальны, а диапазон каждого фактора иметь положительную ширину."}, {"title": "Проверить смысл статуса", "body": "completed означает, что представлены все требуемые свойства. failed может храниться без полного набора измерений и не участвует в регрессии. calibration — отдельная роль завершённого наблюдения."}, {"title": "Проверить параметры опыта", "body": "Те же имена, границы и ограничения проверяются при ручном вводе, CSV-импорте и выдаче кандидата. Дальше добавим контроль единиц и протоколов, которого в текущей версии нет."}], "snippet": "def validate_result(config, result):\n    validate_parameters(config, result[\"parameters\"])\n    names = {t[\"name\"] for t in config[\"targets\"]}\n    values = result.get(\"outcomes\", {})\n    if not set(values) \u003c= names:\n        raise ValueError(\"Есть неизвестные имена измеряемых свойств\")\n    if result[\"status\"] == \"completed\" and set(values) != names:\n        raise ValueError(\"Для завершённого опыта нужны все целевые свойства\")", "snippetLabel": "Действующий контракт завершённого опыта", "snippetFile": "polymer_lab/api.py · validate_result", "acceptance": ["Единицы каждого значения однозначно заданы и преобразуются по проверяемым правилам.", "Частичные измерения имеют явный статус, не маскируются нулями и не попадают в неверную модель."], "related": ["data", "constraints", "feedback"], "refs": []}, {"id": "storage", "title": "API и состояние", "status": "implemented", "subtitle": "FastAPI + SQLite", "input": ["Запросы интерфейса", "Проверенные результаты", "Конфигурация"], "output": ["Состояние проекта", "Рекомендации с ID", "Журнал последних 200 событий"], "implemented": ["В SQLite хранится один сериализованный JSON-документ состояния проекта.", "RLock и транзакция обеспечивают атомарное обновление в рамках локального процесса.", "Сохраняются configuration, trials, recommendations, model metadata, acquisition, revision.", "Рекомендации содержат ID обучающих опытов.", "Снимок переживает перезапуск приложения."], "planned": ["Нормализованная схема БД для кампаний, измерений, версий моделей и пользователей.", "Версионирование артефактов моделей и данных.", "Авторизация, права и промышленный аудит."], "files": [{"path": "polymer_lab/api.py", "symbol": "Store, log, view, create_app"}], "fact_note": "Фактические обученные GP не сериализуются в БД: model — метаданные. При каждом запросе рекомендаций обучение запускается заново.", "purpose": "Сервис хранит согласованную версию проекта и обслуживает интерфейс через HTTP API. Для небольшого локального MVP выбран SQLite с одним документом состояния: это простая проверяемая основа для цикла, а не готовая многопользовательская LIMS.", "steps": [{"title": "Прочитать текущее состояние", "body": "Store.load получает JSON из единственной строки таблицы state. Документ включает конфигурацию, историю опытов, текущие рекомендации, ревизию и журнал событий."}, {"title": "Выполнить действие под блокировкой", "body": "Маршруты API используют RLock: внутри локального процесса чтение, изменение и сохранение не перемешиваются с другим запросом. Само сохранение выполняется в транзакции SQLite."}, {"title": "Зафиксировать происхождение рекомендации", "body": "Каждый кандидат получает recommendation_id, время и training_trial_ids. Сохранённое поле model описывает обучение и калибровку, но не содержит сериализованный объект sklearn."}, {"title": "Подготовить следующий уровень хранения", "body": "Для нескольких кампаний выделим сущности experiment, measurement, model_version и recommendation. Артефакты моделей и сырые измерения будут версионироваться отдельно от текущего состояния интерфейса."}], "snippet": "def save(self, state):\n    text = json.dumps(state, ensure_ascii=False, allow_nan=False)\n    with self.db:\n        self.db.execute(\"INSERT INTO state(id,payload) VALUES(1,?) ON CONFLICT(id) DO UPDATE SET payload=excluded.payload\", (text,))", "snippetLabel": "Действующее атомарное сохранение состояния", "snippetFile": "polymer_lab/api.py · Store.save", "acceptance": ["Любая рекомендация восстанавливается по версии кода, конфигурации и точному набору обучающих данных.", "Перезапуск сохраняет историю и статусы опытов; резервная копия проверена восстановлением."], "related": ["schema", "feedback", "runtime"], "refs": []}, {"id": "gp", "title": "Прогноз свойств", "status": "implemented", "subtitle": "Независимый Gaussian Process на каждое свойство", "input": ["Завершённые train-опыты", "Нормированные факторы [0, 1]"], "output": ["Среднее μ для каждого свойства", "Стандартное отклонение σ", "Отчёт модели"], "implemented": ["sklearn GaussianProcessRegressor.", "Ядро ConstantKernel × Matérn 5/2 + WhiteKernel; отдельная длина шкалы по каждому фактору.", "normalize_y=True; alpha=1e-8 для численной устойчивости.", "Гиперпараметры подбирает L-BFGS-B с ограничением 60 итераций.", "Для обучения требуется минимум 3 различные завершённые train-точки.", "Если данных меньше, применяется начальный план без выдуманных прогнозов."], "planned": ["Ridge и CatBoostRegressor как честные сравнительные модели.", "BoTorch SingleTaskGP / ModelListGP для раздельно измеренных свойств.", "Раздельное представление неопределённости функции и шума наблюдений."], "files": [{"path": "polymer_lab/engine.py", "symbol": "_fit, _optimizer, _recommend"}], "fact_note": "Ни CatBoost, ни BoTorch пока не установлены и не обучены в MVP. 3 точки — технический минимум запуска, не доказательство качества.", "purpose": "Модель отвечает на вопрос: какие свойства можно ожидать при заданных параметрах опыта и насколько неопределён этот прогноз? В v0.1 каждое свойство имеет свой независимый Gaussian Process; выбор следующего эксперимента выполняет отдельный модуль.", "steps": [{"title": "Отобрать обучающие наблюдения", "body": "Используются только completed с role=train. calibration и failed не определяют ни гиперпараметры, ни лучшую обучающую точку. Если разных train-точек меньше трёх, модель не строится."}, {"title": "Привести шкалы", "body": "Входы переводятся в [0, 1] по заданным границам факторов. normalize_y=True стандартизует отклик внутри sklearn. Это помогает оптимизации гиперпараметров, но не исправляет ошибочные единицы."}, {"title": "Обучить отдельный GP", "body": "ConstantKernel задаёт масштаб, Matérn 5/2 — ковариационную структуру с отдельной длиной шкалы для каждого фактора, WhiteKernel — компонент шума. alpha=1e-8 служит численной устойчивости."}, {"title": "Вернуть распределение прогноза", "body": "Для каждого кандидата вызывается predict(..., return_std=True). Средние и стандартные отклонения идут в acquisition, а затем в отображение интервалов. Сейчас шум наблюдения и неопределённость скрытой функции не представлены отдельными полями."}, {"title": "Сравнить до усложнения", "body": "Следующий этап — одинаковая групповая проверка GP, Ridge и CatBoost. Переход к BoTorch / ModelListGP нужен, когда понадобятся более строгий acquisition, известный шум или разные наборы наблюдений для разных свойств."}], "snippet": "kernel = ConstantKernel(1.0, (0.01, 100.0)) * Matern(\n    np.repeat(0.35, spec.dimension), (0.04, 5.0), nu=2.5\n) + WhiteKernel(0.0025, (1e-6, 0.3))\nmodel = GaussianProcessRegressor(kernel=kernel, alpha=1e-8, normalize_y=True,\n                                 optimizer=_optimizer, n_restarts_optimizer=0,\n                                 random_state=(spec.seed + j) % (2**32))", "snippetLabel": "Действующая конфигурация Gaussian Process", "snippetFile": "polymer_lab/engine.py · _fit", "acceptance": ["GP, Ridge и CatBoost сравнены на одинаковых независимых группах и одном протоколе препроцессинга.", "Для каждого свойства есть MAE/RMSE и график ошибки по области факторов.", "При частичных выходах модель использует только фактически измеренные значения соответствующего свойства."], "related": ["data", "uncertainty", "acquisition", "evaluation"], "refs": [{"title": "scikit-learn · Gaussian Process", "url": "https://scikit-learn.org/stable/modules/gaussian_process.html"}, {"title": "BoTorch · типы моделей", "url": "https://botorch.org/docs/models"}, {"title": "CatBoost · неопределённость", "url": "https://catboost.ai/docs/en/references/uncertainty"}]}, {"id": "uncertainty", "title": "Неопределённость", "status": "implemented", "subtitle": "GP-интервалы + split conformal", "input": ["Обученный GP", "Отдельные calibration-измерения", "Уровень confidence"], "output": ["Интервал на каждое свойство", "Тип интервала", "Предупреждения о применимости"], "implemented": ["Калибровочные outcomes не участвуют в обучении GP, выборе лучшего опыта и acquisition.", "Оценка невязки |y − μ| / σ на калибровочной выборке.", "Порядковая статистика с рангом ceil((n + 1) × confidence), без интерполяции.", "При недостатке данных возвращается явно некалиброванный GP-интервал.", "Совместная вероятность попадания всех свойств всегда помечена probability_calibrated=false."], "planned": ["Протокол независимой калибровки для выбранного типа опыта.", "Проверка фактического покрытия и ширины интервалов на новых группах.", "Групповая или иерархическая калибровка для кинетических кривых."], "files": [{"path": "polymer_lab/engine.py", "symbol": "_fit, _recommend"}, {"path": "examples/synthetic_calibration.csv", "symbol": "30 независимых синтетических calibration-записей"}], "fact_note": "Заявляется только маргинальное покрытие отдельного свойства при обменности данных. Не заявлены совместное покрытие и гарантия для адаптивно выбранных кандидатов. В текущем коде совпадающие по X train/calibration-точки исключаются из калибровки.", "purpose": "Интервал должен отражать неопределённость прогноза и явно сообщать, чем он обоснован. Текущая реализация умеет расширять или сужать интервалы по отдельной калибровочной выборке, но не выдаёт это за доказанную вероятность успеха на новой установке.", "steps": [{"title": "Отделить калибровку от обучения", "body": "calibration-исходы не используются для обучения GP, incumbent или score кандидатов. В текущем коде точки калибровки, совпадающие по X с train, консервативно исключаются; протокол повторных измерений ещё предстоит проработать."}, {"title": "Посчитать нормированные невязки", "body": "На калибровочных наблюдениях вычисляется |y − μ| / σ отдельно по каждому свойству. Это измеряет, насколько реальные ошибки соотносятся с модельной шириной прогноза."}, {"title": "Выбрать конечновыборочный квантиль", "body": "Используется ранг ceil((n + 1) × confidence). Если ранг превышает число наблюдений, конечный conformal-интервал не выдаётся: интерфейс показывает обычный GP-интервал с меткой некалиброванного."}, {"title": "Проверить протокол на реальных данных", "body": "Покрытие требует обменности. Для кинетических кривых недостаточно просто назвать строки calibration: нужен endpoint на уровне опыта либо групповой/иерархический метод. Отдельно оцениваем долю попаданий и ширину интервалов."}], "snippet": "cal_x = np.asarray([row[\"x\"] for row in calibration])\ncal_y = np.asarray([row[\"y\"][j] for row in calibration])\nmean, std = model.predict(cal_x, return_std=True)\nstd = np.maximum(std, spec.scales[j] * 1e-9)\nresiduals = np.abs(cal_y - mean) / std\nquantile = float(np.sort(residuals)[rank - 1])\nreport.update(quantile=quantile, status=\"split_conformal_marginal\",\n              interval_type=\"split_conformal_marginal\")", "snippetLabel": "Действующий split-conformal расчёт по каждому свойству", "snippetFile": "polymer_lab/engine.py · _fit", "acceptance": ["Протокол определяет независимую экспериментальную единицу и способ выделения калибровки.", "На отложенных группах измерены покрытие и средняя ширина интервалов.", "Совместная вероятность и маргинальные интервалы имеют разные явные подписи в интерфейсе."], "related": ["gp", "evaluation", "feedback"], "refs": [{"title": "Введение в conformal prediction", "url": "https://arxiv.org/abs/2107.07511"}, {"title": "Conformal inference для иерархических данных", "url": "https://arxiv.org/abs/2306.06342"}]}, {"id": "acquisition", "title": "Выбор следующего опыта", "status": "implemented", "subtitle": "Bayesian optimization", "input": ["Прогнозы GP в допустимых точках", "Целевые диапазоны", "Лучший измеренный train-результат"], "output": ["До 3 кандидатов", "Численный score", "Объяснение выбора"], "implemented": ["Потеря — среднее нормированное отклонение свойств за границы целевых диапазонов.", "До первого попадания максимизируется Monte Carlo expected improvement этой потери.", "После первого измеренного попадания выбирается высокая модельная вероятность повторного попадания.", "По умолчанию 128 MC-выборок и до 1536 точек-кандидатов.", "Несколько кандидатов выбираются жадно со штрафом за близость."], "planned": ["BoTorch qLogNEI для более устойчивой работы с шумом.", "Учёт стоимости и времени синтеза, очереди ещё не завершённых опытов.", "Стратегия подтверждающих повторов и критерий остановки кампании."], "files": [{"path": "polymer_lab/engine.py", "symbol": "_loss, _best, _recommend"}], "fact_note": "Текущая серия — эвристика разнообразия, не точный совместный q-EI. qLogNEI пока только запланирован. Несколько целевых диапазонов сами по себе не означают необходимость Pareto-оптимизации.", "purpose": "Этот модуль превращает прогноз модели в решение, какой опыт проводить следующим. Он сопоставляет вероятное приближение к целевым свойствам с неопределённостью и возвращает конкретный набор допустимых параметров.", "steps": [{"title": "Задать полезность результата", "body": "У всех свойств есть целевые границы. Потеря равна среднему нормированному нарушению этих границ; внутри всех диапазонов она нулевая. Для двусторонней цели масштаб — ширина диапазона."}, {"title": "Оценить возможное улучшение", "body": "Из прогнозов независимых GP получаем Monte Carlo-выборки и считаем ожидаемое уменьшение потери относительно лучшего измеренного train-опыта. Одни и те же случайные вариации используются для сравнения кандидатов."}, {"title": "Изменить критерий после попадания", "body": "Когда train-история уже содержит попадание во все цели, обычное улучшение нулевой потери невозможно. Тогда текущий алгоритм предпочитает новую точку с высокой модельной вероятностью повторного попадания."}, {"title": "Сформировать небольшую серию", "body": "Для серии из двух или трёх кандидатов применяется штраф за близость к уже выбранным точкам. Это понятная эвристика, а не точная оптимизация совместного batch-acquisition."}, {"title": "Учесть шум и цену следующего опыта", "body": "В следующем этапе рассмотрим qLogNEI в BoTorch, pending-точки и стоимость эксперимента. Критерий остановки и подтверждающие повторы потребуют отдельного протокола."}], "snippet": "def _loss(spec: _Spec, y: np.ndarray) -\u003e np.ndarray:\n    with np.errstate(over=\"ignore\", invalid=\"ignore\"):\n        violation = np.maximum(spec.target_lower - y, 0.0) + np.maximum(y - spec.target_upper, 0.0)\n        value = np.mean(violation / spec.scales, axis=-1)\n    if not np.all(np.isfinite(value)):\n        raise ValueError(\"Числовой масштаб свойств слишком велик. Проверьте значения и единицы измерения.\")\n    return value", "snippetLabel": "Действующая целевая функция: нарушение диапазонов", "snippetFile": "polymer_lab/engine.py · _loss", "acceptance": ["Офлайн-выбор не получает скрытые результаты до запроса соответствующего кандидата.", "Все методы сравниваются при одном бюджете, включая начальный план и подтверждения.", "Причина выбора воспроизводится по сохранённым параметрам acquisition и истории."], "related": ["gp", "constraints", "experiment", "evaluation"], "refs": [{"title": "BoTorch · замкнутый цикл с qLogNEI", "url": "https://botorch.org/docs/tutorials/closed_loop_botorch_only"}, {"title": "BoTorch · функции полезности", "url": "https://botorch.org/docs/objectives"}]}, {"id": "constraints", "title": "Допустимая область", "status": "implemented", "subtitle": "Границы и линейные ограничения", "input": ["Границы каждого фактора", "Система A·x ≤ b", "История уже выполненных точек"], "output": ["Новые допустимые кандидаты", "Ошибка, если область пуста"], "implemented": ["scipy.optimize.linprog проверяет существование допустимой области.", "Глобальные кандидаты Latin Hypercube дополняются локальными точками около лучших результатов.", "Для узких многогранников используются выпуклые комбинации вершин и hit-and-run.", "Отбрасываются уже выполненные train/calibration/failed-точки.", "Финальные параметры повторно проверяются перед выдачей."], "planned": ["Управляемые категориальные факторы.", "Согласованные с технологом нелинейные правила и ограничения установки.", "Осознанные повторные измерения для оценки шума."], "files": [{"path": "polymer_lab/engine.py", "symbol": "_feasible, _candidate_pool, _parameters"}, {"path": "polymer_lab/api.py", "symbol": "ProjectConfig.consistency"}], "fact_note": "Выполнение математических ограничений не является доказательством безопасности химического режима.", "purpose": "Поиск проходит только внутри явно заданного пространства параметров. Этот слой отвечает за математическую допустимость кандидатов: технологические правила и возможность выполнения конкретного режима задаёт специалист по установке.", "steps": [{"title": "Проверить существование области", "body": "Перед поиском linprog проверяет совместимость диапазонов факторов и линейных неравенств. Если допустимой области нет, алгоритм возвращает понятную ошибку вместо случайной рекомендации."}, {"title": "Покрыть пространство", "body": "Основной пул генерируется Latin Hypercube в нормированном кубе. К нему добавляются локальные возмущения около нескольких лучших train-результатов, после чего недопустимые точки удаляются."}, {"title": "Обработать узкую геометрию", "body": "Если допустимых кандидатов слишком мало, используются вершины многогранника, их выпуклые комбинации и hit-and-run. Это нужно для ограничений, оставляющих очень узкую область."}, {"title": "Исключить ненужные повторы", "body": "Из пула убираются точки, совпадающие с уже проведёнными train/calibration/failed. Перед выдачей выбранная точка снова проходит проверку. В будущем повторы для оценки шума будут отдельным осознанным действием."}], "snippet": "def _feasible(spec: _Spec, points: np.ndarray) -\u003e np.ndarray:\n    valid = np.all((points \u003e= 0.0) & (points \u003c= 1.0), axis=1)\n    if len(spec.coefficients):\n        valid &= np.all(spec.denormalize(points) @ spec.coefficients.T \u003c= spec.constraint_upper + 1e-10, axis=1)\n    return valid", "snippetLabel": "Действующая проверка границ и линейных ограничений", "snippetFile": "polymer_lab/engine.py · _feasible", "acceptance": ["Каждое правило установки согласовано и имеет проверяемую реализацию.", "Категориальные значения выбираются из разрешённого перечня, а не кодируются произвольными непрерывными числами.", "Подтверждающие повторы разрешаются явно и входят в бюджет кампании."], "related": ["schema", "acquisition", "experiment"], "refs": [{"title": "BoTorch · входные и выходные ограничения", "url": "https://botorch.org/docs/constraints"}]}, {"id": "experiment", "title": "Проведение опыта", "status": "mixed", "subtitle": "Симулятор сегодня, оператор в реальном пилоте", "input": ["Параметры рекомендации", "ID рекомендации"], "output": ["Фактический или синтетический результат", "Статус выполнения"], "implemented": ["В demo результат выдаёт воспроизводимая искусственная функция от трёх факторов A/B/C.", "В real симулятор отключён; пользователь вносит результаты вручную или через CSV.", "Результат с recommendation_id должен соответствовать параметрам актуальной рекомендации.", "Устаревший ID возвращает ошибку 409."], "planned": ["Проверка и утверждение плана технологом.", "Интеграция с LIMS/историей установки по согласованному интерфейсу.", "Операционные статусы planned / running / measured / rejected.", "Аппаратная интеграция только после согласования протокола установки."], "files": [{"path": "polymer_lab/simulator.py", "symbol": "evaluate, initial_trials"}, {"path": "polymer_lab/api.py", "symbol": "simulate, result"}], "fact_note": "Нет подключения к физическому оборудованию. Симулятор — не химическая модель, названия свойств учебные.", "purpose": "Параметры кандидата превращаются в проведённый опыт и измеренный результат. В MVP этот переход реализован искусственным симулятором или ручным внесением; аппаратная связь с реальной пилотной установкой ещё отсутствует.", "steps": [{"title": "Получить актуальную рекомендацию", "body": "Кандидат имеет ID, параметры, прогнозы и ссылки на использованную train-историю. После добавления новых данных прежние рекомендации становятся устаревшими."}, {"title": "Выполнить опыт в выбранном режиме", "body": "В demo синтетическая функция вычисляет три условных свойства по факторам A/B/C. В real вызов /api/simulate запрещён; фактические результаты поступают через /api/results или CSV."}, {"title": "Связать измерение с планом", "body": "Если передан recommendation_id, API проверяет его актуальность и совпадение параметров. Отклонённый или изменённый режим не должен незаметно приписываться исходной рекомендации."}, {"title": "Подключить оператора и оборудование", "body": "В реальном пилоте появятся утверждение технологом, очередь выполнения, статусы и согласованный адаптер LIMS/установки. Автономное управление реактором не является функцией текущего прототипа."}], "snippet": "@app.post(\"/api/simulate\")\ndef simulate(payload: SimulateRequest):\n    with store.lock:\n        current = store.load()\n        if current[\"config\"].get(\"mode\") != \"demo\":\n            raise HTTPException(409, \"Симулятор выключен для реального проекта. Загрузите фактические измерения\")\n        candidate = next((r for r in current[\"recommendations\"] if r[\"id\"] == payload.recommendation_id), None)\n        if candidate is None:\n            raise HTTPException(409, \"Рекомендация устарела или отсутствует\")", "snippetLabel": "Действующее разделение demo и real", "snippetFile": "polymer_lab/api.py · simulate", "acceptance": ["Для каждого выполненного опыта сохранены утверждённые и фактические параметры.", "Повторная доставка результата не создаёт дубликат опыта.", "Адаптер установки проверен сначала на согласованной имитации обмена, затем в наблюдаемом пилоте."], "related": ["acquisition", "constraints", "feedback", "runtime"], "refs": []}, {"id": "feedback", "title": "Измерение и переобучение", "status": "implemented", "subtitle": function renderSidebar(){document.getElementById('sidebar').innerHTML=`<div class="project-label"><strong>Карта проекта</strong><p>Полимерные инновации · №14</p></div><nav class="nav-list">${navLink('map','Архитектура','map')}${navLink('datasets','Данные для обучения','data')}${navLink('models','Модели и стек','cpu')}${navLink('roadmap','План пилота','roadmap')}${navLink('sources','Источники и код','book')}</nav><div class="nav-divider"></div><div class="nav-heading">УСТРОЙСТВО СИСТЕМЫ</div>${[['Данные и инфраструктура',['data','schema','storage']],['Модель и выбор опыта',['gp','uncertainty','acquisition','constraints']],['Эксперимент и качество',['experiment','feedback','evaluation','runtime']]].map(([title,ids],i)=>`<details class="nav-group" ${i===1||ids.includes(currentModule)?'open':''}><summary>${icon('chevron')}${title}</summary><div class="nav-sub">${ids.map(id=>`<a href="#/module/${id}" class="${currentModule===id?'active':''}"><span class="tiny-status ${statusInfo[M[id].status][0]}"></span>${esc(M[id].title)}</a>`).join('')}</div></details>`).join('')}<div class="sidebar-note"><strong>Живая схема, точные статусы</strong>Зелёным — работающий код.<br>Фиолетовым — следующие этапы.</div><div class="sidebar-bottom"><span class="version">MVP v0.1.0</span><span>18.11.2026</span></div>`}

function mapPage(){return `<div class="page page-enter"><div class="page-heading map-heading"><div><div class="kicker">SYURAI POLYMER LAB · ИНТЕРАКТИВНЫЙ АТЛАС</div><h1>От данных — <span class="lighter">к следующему синтезу.</span></h1><p>Откройте любой модуль, чтобы увидеть его устройство, код и следующий шаг разработки.</p></div><div class="heading-action"><button class="btn primary" id="walk-start">${icon('play')}Пройти цикл</button></div></div><div id="walk-slot"></div><div class="map-tools"><div class="filter-group" role="group" aria-label="Фильтр готовности"><button class="filter-btn ${filter==='all'?'active':''}" data-filter="all">Вся система <span>12</span></button><button class="filter-btn ${filter==='implemented'?'active':''}" data-filter="implemented">В MVP</button><button class="filter-btn ${filter==='planned'?'active':''}" data-filter="planned">Что дальше</button></div><div class="tools-end"><span class="text-hint">Нажмите на блок, чтобы раскрыть</span><div class="view-toggle" role="group" aria-label="Вид карты"><button data-view="map" class="${viewMode==='map'?'active':''}" aria-label="Показать карту" title="Карта">${icon('map')}</button><button data-view="list" class="${viewMode==='list'?'active':''}" aria-label="Показать список" title="Список">${icon('list')}</button></div></div></div><div id="map-view" ${viewMode!=='map'?'hidden':''}><div class="canvas-wrap" id="canvas-wrap"><div class="canvas-caption"><span class="live-line"></span><span>ПРОГРАММНЫЙ ЦИКЛ · v0.1.0</span></div><div class="canvas" id="canvas" aria-label="Интерактивная карта. Нажмите на модуль. Поле можно перемещать."><div class="world" id="world"><div class="lane" style="top:77px"><span class="lane-label">ДАННЫЕ И ИХ КОНТРАКТ</span></div><div class="lane" style="top:294px"><span class="lane-label">МОДЕЛЬ И ВЫБОР</span></div><div class="lane" style="top:511px"><span class="lane-label">ОЦЕНКА И НОВЫЙ ОПЫТ</span></div><svg class="edges" viewBox="0 0 1240 744" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#a8bc9b" stroke-width="1.6"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a292b4" stroke-width="1.6"/></marker></defs>${edges.map((e,i)=>`<path class="edge ${e.dash?'dash':''}" id="edge-${i}" d="${e.d}" marker-end="url(#${e.dash?'arrow-violet':'arrow'})"/>${e.label?`<text class="edge-label ${e.dash?'violet':''}" x="${e.label.x}" y="${e.label.y}" ${e.label.rotate?`transform="rotate(-90 ${e.label.x} ${e.label.y})"`:''}>${e.label.t}</text>`:''}`).join('')}</svg>${coreIds.map(id=>{const m=M[id],p=mapMeta[id];return `<button class="map-node ${id==='gp'?'model':id==='acquisition'?'core':id==='uncertainty'?'uncertainty':''}" style="left:${p.x}px;top:${p.y}px" data-node="${id}" aria-label="${esc(m.title)} — открыть модуль"><div class="node-top">${icon(id)}${pill(m.status,id==='gp')}</div><div class="node-title">${p.title}</div><div class="node-description">${p.sub}</div><div class="node-bottom"><span class="tag">${p.tag}</span><span class="node-open">Подробнее</span></div></button>`}).join('')}</div></div><div class="canvas-controls"><button id="zoom-out" title="Уменьшить" aria-label="Уменьшить">${icon('minus')}</button><span id="zoom-value">100%</span><button id="zoom-in" title="Увеличить" aria-label="Увеличить">${icon('plus')}</button><div class="control-divider"></div><button id="fit-map" title="Вместить карту" aria-label="Вместить карту">${icon('fit')}</button><button id="full-map" title="Развернуть карту" aria-label="Развернуть карту">${icon('fullscreen')}</button></div><div class="canvas-legend"><span><i></i>Основной поток</span><span><i class="dashed"></i>Оценка интервалов</span></div></div><div class="map-footer"><span>Перетаскивайте поле · Ctrl + колесо — масштаб · Esc — закрыть блок</span><span>9 модулей в цикле · 3 инженерных раздела</span></div></div><div id="list-view" class="node-list" ${viewMode!=='list'?'hidden':''}></div><div id="support-slot" ${viewMode!=='map'?'hidden':''} class="support-grid">${['evaluation','runtime','roadmap'].map(id=>`<button class="support-card" data-open-module="${id}"><div class="support-icon">${icon(id)}</div><div><strong>${id==='evaluation'?'Проверка результата':id==='runtime'?'Приложение и API':'От MVP к реальному пилоту'}</strong><p>${id==='evaluation'?'Тесты, метрики, честный benchmark':id==='runtime'?'Запуск, экраны и контракты':'Данные, модели, интеграция установки'}</p>${pill(M[id].status)}</div></button>`).join('')}</div></div>`}
function matchesFilter(m){return filter==='all'||(filter==='implemented'?m.status==='implemented':m.status!=='implemented')}
function renderList(){const e=document.getElementById('list-view');if(!e)return;e.innerHTML=MODULES.filter(matchesFilter).map(m=>`<button class="list-card" data-open-module="${m.id}"><div class="list-card-top">${icon(m.id)}${pill(m.status)}</div><h3>${esc(m.title)}</h3><p>${esc(m.subtitle)}</p><span class="tag">${esc(m.files[0]?.path||'Следующий этап')}</span></button>`).join('');}
function applyMapState(){coreIds.forEach(id=>{const n=document.querySelector(`[data-node="${id}"]`);if(!n)return;n.classList.toggle('dimmed',!matchesFilter(M[id]));n.classList.toggle('selected',id===selectedNode);n.setAttribute('aria-expanded',String(id===selectedNode));n.setAttribute('aria-controls','drawer')});edges.forEach((e,i)=>{const el=document.getElementById('edge-'+i);if(!el)return;el.classList.toggle('focused',!!selectedNode&&(e.a===selectedNode||e.b===selectedNode));el.classList.toggle('dim',!!selectedNode&&e.a!==selectedNode&&e.b!==selectedNode)});document.querySelectorAll('[data-filter]').forEach(el=>el.classList.toggle('active',el.dataset.filter===filter));document.querySelectorAll('.support-card[data-open-module]').forEach(el=>el.classList.toggle('dimmed',!matchesFilter(M[el.dataset.openModule])));renderList();}
function applyTransform(){const w=document.getElementById('world');if(w)w.style.transform=`translate(${transform.x}px,${transform.y}px) scale(${transform.scale})`;const z=document.getElementById('zoom-value');if(z)z.textContent=Math.round(transform.scale*100)+'%';}
function fitMap(){const c=document.getElementById('canvas');if(!c||c.clientWidth===0)return;const scale=Math.min(c.clientWidth/1240,(c.clientHeight-18)/744,1.25);transform={scale,x:(c.clientWidth-1240*scale)/2,y:(c.clientHeight-744*scale)/2+8};applyTransform();}
function zoomBy(factor,x,y){const c=document.getElementById('canvas');if(!c)return;const px=x??c.clientWidth/2,py=y??c.clientHeight/2;const s=Math.min(1.9,Math.max(.27,transform.scale*factor)),ratio=s/transform.scale;transform.x=px-(px-transform.x)*ratio;transform.y=py-(py-transform.y)*ratio;transform.scale=s;applyTransform();}
function setupMap(){renderList();applyMapState();requestAnimationFrame(fitMap);const c=document.getElementById('canvas');let drag=null;c.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,tx:transform.x,ty:transform.y};c.setPointerCapture(e.pointerId);c.classList.add('grabbing')});c.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;transform.x=drag.tx+e.clientX-drag.x;transform.y=drag.ty+e.clientY-drag.y;applyTransform()});const endDrag=()=>{drag=null;c.classList.remove('grabbing')};c.addEventListener('pointerup',endDrag);c.addEventListener('pointercancel',endDrag);c.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();const r=c.getBoundingClientRect();zoomBy(e.deltaY<0?1.1:1/1.1,e.clientX-r.left,e.clientY-r.top)},{passive:false});document.getElementById('zoom-in').onclick=()=>zoomBy(1.16);document.getElementById('zoom-out').onclick=()=>zoomBy(1/1.16);document.getElementById('fit-map').onclick=fitMap;document.getElementById('full-map').onclick=()=>{document.getElementById('canvas-wrap').classList.toggle('maximized');requestAnimationFrame(fitMap)};document.getElementById('walk-start').onclick=()=>{walkIndex=0;filter='all';viewMode='map';closeDrawer(false);setMapView();showWalk()};if(boardResize)boardResize.disconnect();boardResize=new ResizeObserver(()=>{if(viewMode==='map')fitMap()});boardResize.observe(c);if(walkIndex>=0)showWalk();}
function setMapView(){document.getElementById('map-view').hidden=viewMode!=='map';document.getElementById('list-view').hidden=viewMode!=='list';document.getElementById('support-slot').hidden=viewMode!=='map';document.querySelectorAll('[data-view]').forEach(e=>e.classList.toggle('active',e.dataset.view===viewMode));if(viewMode==='map')requestAnimationFrame(fitMap);}
function showWalk(){const slot=document.getElementById('walk-slot');if(!slot)return;if(walkIndex<0){slot.innerHTML='';selectedNode=null;applyMapState();return;}const w=walkthrough[walkIndex];selectedNode=w.id;slot.innerHTML=`<div class="walkbar"><div><div class="walkcount">ШАГ ${walkIndex+1} / ${walkthrough.length}</div><strong>${w.title}</strong><p>${w.body}</p></div><div class="walkbuttons"><button class="btn icon-only" data-walk="prev" aria-label="Предыдущий шаг" ${walkIndex===0?'disabled':''}><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button><button class="btn" data-walk="next">${walkIndex===walkthrough.length-1?'Готово':'Далее'}</button><button class="btn icon-only" data-walk="close" aria-label="Закрыть обзор">${icon('close')}</button></div></div>`;applyMapState();}
function openDrawer(id){if(!M[id])return;selectedNode=id;applyMapState();const m=M[id],d=document.getElementById('drawer');lastFocus=document.activeElement;d.innerHTML=`<div class="drawer-header"><span>МОДУЛЬ СИСТЕМЫ</span><button class="btn icon-only" id="drawer-close" aria-label="Закрыть модуль">${icon('close')}</button></div><div class="drawer-body"><div class="drawer-icon">${icon(id)}</div><h2>${esc(m.title)}</h2>${pill(m.status)}<p class="drawer-subtitle">${esc(m.purpose||m.subtitle)}</p><div class="drawer-section"><div class="kicker">ВХОДНЫЕ ДАННЫЕ</div><ul class="compact-list">${m.input.slice(0,3).map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div><div class="drawer-section"><div class="kicker">НА ВЫХОДЕ</div><ul class="compact-list">${m.output.slice(0,3).map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>${m.files[0]?`<div class="drawer-section"><div class="kicker">РЕАЛИЗАЦИЯ</div><div class="drawer-file">${esc(m.files[0].path)}<br><span style="opacity:.7">${esc(m.files[0].symbol)}</span></div></div>`:''}<div class="drawer-section"><div class="kicker">СВЯЗАННЫЕ МОДУЛИ</div><div class="related-small">${(m.related||[]).slice(0,3).map(r=>`<button data-node="${r}">${esc(M[r].title)}</button>`).join('')}</div></div></div><div class="drawer-footer"><button class="btn primary" data-open-module="${id}">${icon('book')}Открыть страницу модуля</button></div>`;d.classList.add('open');d.setAttribute('aria-hidden','false');d.inert=false;document.getElementById('drawer-close').onclick=()=>closeDrawer();document.getElementById('drawer-close').focus({preventScroll:true});}
function closeDrawer(restore=true){const d=document.getElementById('drawer');d.classList.remove('open');d.setAttribute('aria-hidden','true');d.inert=true;if(walkIndex<0)selectedNode=null;applyMapState();if(restore&&lastFocus?.isConnected)lastFocus.focus({preventScroll:true});}
function note(text,type=''){return text?`<div class="note ${type}">${icon('info')}<div>${esc(text)}</div></div>`:'';}
function list(items,plan=false){return `<ul class="checklist ${plan?'plan':''}">${items.map(t=>`<li>${icon(plan?'circle':'check')}<span>${esc(t)}</span></li>`).join('')}</ul>`;}
function codeBlock(code,label,file,caption=''){return `<div class="code-block"><div class="code-top"><span>${esc(label||file||'Код')}</span><button class="copy-btn" data-copy-code>${icon('copy')}Копировать</button></div><pre><code>${esc(code)}</code></pre></div>${caption?`<p class="code-caption">${esc(caption)}</p>`:''}`;}
function refsMarkup(refs){return `<div class="source-links">${(refs||[]).map(r=>`<a class="source-link" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${icon('external')}<span>${esc(r.title)}<small>${esc(new URL(r.url).hostname)}</small></span></a>`).join('')}</div>`;}
function detailAside(m){return `<aside class="detail-aside"><div class="aside-box"><h3>Статус реализации</h3>${pill(m.status)}<p style="margin-top:12px">${m.status==='planned'?'Запланировано после MVP.':'Сверено с исходниками версии 0.1.0.'}<br>Карта описывает код и согласованный следующий этап.</p></div>${m.files.length?`<div class="aside-box"><h3>Где в проекте</h3><div class="aside-files">${m.files.map(f=>`<div class="file-item"><button data-copy-path="${esc(f.path)}" title="Скопировать путь"><code>${esc(f.path)}</code></button><p>${esc(f.symbol)}</p></div>`).join('')}</div></div>`:''}<div class="aside-box"><h3>Связанные модули</h3><div class="aside-relations">${(m.related||['data','gp','acquisition']).map(id=>`<a href="#/module/${id}">${icon(id)}${esc(M[id].title)}</a>`).join('')}</div></div>${m.refs?.length?`<div class="aside-box"><h3>Документация</h3>${refsMarkup(m.refs)}</div>`:''}</aside>`;}
function detailContent(m){if(detailTab==='overview')return `<section class="content-block"><h2>Что делает этот модуль</h2><p class="prose">${esc(m.purpose||m.subtitle)}</p></section><section class="content-block"><h2>Как устроена работа</h2><div class="process-steps">${(m.steps||m.implemented.slice(0,4).map((b,i)=>({title:'Этап '+(i+1),body:b}))).map((s,i)=>`<div class="process-step"><span class="step-index">${i+1}</span><div><h3>${esc(s.title)}</h3><p>${esc(s.body)}</p></div></div>`).join('')}</div></section>${note(m.fact_note)}<section class="content-block"><h2>На границе модуля</h2><div class="io-grid"><div class="io-box"><div class="kicker">ВХОД</div>${list(m.input)}</div><div class="io-box"><div class="kicker">ВЫХОД</div>${list(m.output)}</div></div></section>`;
if(detailTab==='implementation')return `<section class="content-block"><h2>${m.implemented.length?'Что уже работает':'Что предстоит реализовать'}</h2>${list(m.implemented.length?m.implemented:m.planned,!m.implemented.length)}</section>${m.snippet?`<section class="content-block"><h2>${m.implemented.length?'Фрагмент реализации':'Предлагаемая реализация'}</h2>${codeBlock(m.snippet,m.snippetLabel,m.snippetFile,m.snippetCaption||'')}</section>`:''}${m.id==='gp'?`<div class="table-wrap"><table><thead><tr><th>Компонент</th><th>Выбор в MVP</th></tr></thead><tbody><tr><td>Ядро</td> <td>ConstantKernel × Matérn 5/2 + WhiteKernel</td></tr><tr><td>Входы</td><td>Масштабирование в [0, 1]</td></tr><tr><td>Выход</td><td>Нормировка через normalize_y=True</td></tr><tr><td>Численная устойчивость</td><td>alpha = 1e-8</td></tr><tr><td>Режим обучения</td><td>Отдельная модель на каждое свойство</td></tr></tbody></table></div>`:''}${note(m.fact_note)}`;
if(detailTab==='contract')return `<section class="content-block"><h2>Входы и выходы</h2><div class="io-grid"><div class="io-box"><h3>Модуль принимает</h3>${list(m.input)}</div><div class="io-box"><h3>Модуль возвращает</h3>${list(m.output)}</div></div></section>${apiContract(m.id)}${note('Примеры с factor_a / factor_b / factor_c относятся к синтетическому демонстратору. Значения не задают режим реального синтеза.','purple')}`;
return `<section class="content-block"><h2>Следующее развитие</h2>${list(m.planned,true)}</section>${m.acceptance?.length?`<section class="content-block"><h2>Когда считаем этап готовым</h2><div class="process-steps">${m.acceptance.map((s,i)=>`<div class="process-step"><span class="step-index">${icon('check')}</span><p>${esc(s)}</p></div>`).join('')}</div></section>`:''}${note('Эти пункты описывают будущую работу. Наличие страницы в карте не означает, что функция уже добавлена в MVP.','purple')}<button class="btn" data-route="roadmap">${icon('roadmap')}Общий план пилота</button>`;}
function apiContract(id){const examples=PROJECT.api_examples;const key=['gp','acquisition','constraints','uncertainty'].includes(id)?'recommend':['experiment','feedback','schema'].includes(id)?'result':id==='storage'?'state':id==='runtime'?'demo':'export';const e=examples[key];let s=`${e.method} ${e.path}`+(e.body?'\nContent-Type: application/json\n\n'+JSON.stringify(e.body,null,2):'');return `<section class="content-block"><h2>Контракт API</h2><p class="prose">${key==='recommend'?'Рекомендация возвращается для текущей ревизии проекта. Запрос запускает обучение на доступных train-измерениях.':key==='result'?'Завершённый опыт должен содержать все свойства из конфигурации. При привязке к рекомендации передаётся её актуальный recommendation_id.':key==='demo'?'Создание демо сбрасывает текущую историю и формирует синтетический начальный набор.':key==='state'?'API возвращает конфигурацию, историю, рекомендации и метаданные последней модели.':'Экспорт нужен для переноса и воспроизведения состояния проекта.'}</p>${codeBlock(s,'HTTP · пример запроса','polymer_lab/api.py','Описание контракта. Эта карта не отправляет запросы в работающий MVP.')}</section>`;}
function modulePage(id){const m=M[id];return `<div class="page page-enter">${breadcrumb(m.title,'Карта проекта')}<div class="detail-heading"><div class="page-title-icon">${icon(id)}</div><div class="kicker">УСТРОЙСТВО МОДУЛЯ</div><h1 style="margin-top:10px">${esc(m.title)}</h1><p>${esc(m.subtitle)}</p><div class="detail-meta">${pill(m.status)}<span class="tag">MVP v0.1.0</span>${id==='gp'?'<span class="tag">CPU</span>':''}</div></div><div class="detail-layout"><div><nav class="detail-tabs" aria-label="Разделы модуля">${[['overview','Как работает'],['implementation','Реализация'],['contract','Входы и выходы'],['next','Что дальше']].map(([k,t])=>`<button class="detail-tab ${detailTab===k?'active':''}" data-detail-tab="${k}" aria-current="${detailTab===k?'page':'false'}">${t}</button>`).join('')}</nav><div id="detail-content">${detailContent(m)}</div></div>${detailAside(m)}</div></div>`;}

function datasetsPage(){return `<div class="page page-enter">${breadcrumb('Данные для обучения')}<div class="page-heading"><div><div class="kicker">ОТКРЫТЫЕ ДАННЫЕ</div><h1>Начать с одной химии.</h1><p>Нужны связанные записи «условия опыта → измеренный результат». Подбираем данные под задачу, а не под размер архива.</p></div></div><div class="data-intro"><div><span class="pill done">Выбор для следующего спринта</span><h2>Monash → один мономер → конверсия</h2><p>Сначала проверяем качество прогноза и выбор следующего опыта на реальных записях. Затем добавляем молярную массу и дисперсность.</p></div><div class="signal-list"><div>${icon('data')}Группа = независимая реакция</div><div>${icon('schema')}Один endpoint и согласованные единицы</div><div>${icon('evaluation')}Скрытые метки при архивном выборе</div></div></div>${DATASETS.map((d,i)=>`<details class="dataset-card" ${i===0?'open':''}><summary><span class="dataset-emoji">${icon(i===0?'experiment':'data')}</span><div class="dataset-name"><h3>${d.name}</h3><p>${d.description}</p></div><span class="pill ${i===0?'done':'plan'}">${d.type}</span>${icon('chevron')}</summary><div class="dataset-body"><div class="dataset-facts"><div class="dataset-fact"><div class="kicker">ОБЪЁМ</div><p>${d.n}</p></div><div class="dataset-fact"><div class="kicker">ПРОИСХОЖДЕНИЕ</div><p>${d.kind}</p></div><div class="dataset-fact"><div class="kicker">ЛИЦЕНЗИЯ</div><p>${d.license}</p></div></div><div class="io-grid" style="margin-bottom:20px"><div class="io-box"><div class="kicker">ПРИЗНАКИ X</div><p>${d.x}</p></div><div class="io-box"><div class="kicker">ЦЕЛИ Y</div><p>${d.y}</p></div></div><p>${d.about}</p>${note(d.caution)}<div class="dataset-actions"><a class="btn" href="${d.url}" target="_blank" rel="noopener noreferrer">${icon('external')}Источник данных</a><a class="btn ghost" href="${d.paper}" target="_blank" rel="noopener noreferrer">Статья / документация</a></div></div></details>`).join('')}<section class="content-block" style="margin-top:30px"><h2>Что хранить в каждой записи</h2><div class="table-wrap"><table><thead><tr><th>Поле</th><th>Зачем нужно</th><th>Статус</th></tr></thead><tbody><tr><td><code>parameters / outcomes</code></td><td>Условия и измеренные свойства</td><td>В MVP</td></tr><tr><td><code>role / status</code></td><td>Разделение обучения, калибровки и неуспехов</td><td>В MVP</td></tr><tr><td><code>experiment_id</code></td><td>Группировка исходных независимых реакций</td><td>В следующем ETL</td></tr><tr><td><code>source / units / protocol</code></td><td>Происхождение и смысл измерений</td><td>В следующем ETL</td></tr><tr><td><code>measurement_time / quality</code></td><td>Согласование NMR/GPC и контроль качества</td><td>В следующем ETL</td></tr></tbody></table></div></section>${note('Доступность страницы не означает разрешение на массовую загрузку или коммерческое использование. PI1M отмечен как academic purpose only; PoLyInfo ограничивает массовое скачивание. Эти источники не выбраны для первого коммерческого спринта.','purple')}</div>`;}
const MODELS={gp:{name:'Gaussian Process',status:'implemented',role:'Основной прогноз свойств',text:'На малой численной выборке GP даёт среднее и оценку неопределённости. В MVP для каждого свойства обучается независимая модель sklearn с Matérn 5/2 и ARD. Это стартовая модель, качество которой предстоит проверить на реальных группах опытов.',input:['Непрерывные управляемые факторы','Завершённые train-измерения'],output:['μ(x) — прогноз свойства','σ(x) — неопределённость модели'],related:'gp'},ridge:{name:'Ridge',status:'planned',role:'Простой линейный baseline',text:'Проверяем, нужна ли усложнённая модель для выбранного набора. Ridge обучается на тех же разбиениях по экспериментам и с той же обработкой признаков. Гиперпараметры подбираются внутри обучающей части, без доступа к тестовым группам.',input:['Численные признаки после нормировки','Те же группы, что для GP'],output:['Предсказание каждого свойства','Базовые MAE / RMSE'],related:'evaluation'},catboost:{name:'CatBoost',status:'planned',role:'Сильный табличный baseline',text:'Добавляем для нелинейностей и будущих категориальных условий: мономера, растворителя или катализатора. Сравниваем с GP на фиксированном протоколе. Модельная оценка uncertainty сама по себе не подтверждает покрытие интервалов.',input:['Численные и при необходимости категориальные признаки','Реальные измерения с группами реакций'],output:['Прогнозы для сравнения с GP','Ошибки на новых группах опытов'],related:'gp'},botorch:{name:'BoTorch',status:'planned',role:'Следующий шаг Bayesian optimization',text:'Это инструментарий для вероятностных моделей и выбора опыта. При переходе используем SingleTaskGP или ModelListGP, если свойства измерены в разных точках. qLogNEI оценивает ожидаемое улучшение при шумных измерениях. Матérn 5/2 задаём явно, если оставляем это ядро.',input:['Train-история и допустимые кандидаты','Целевая функция и шум измерений'],output:['Кандидаты с учётом шумного оптимума','Дальнейшая поддержка очереди опытов'],related:'acquisition'}};

function modelsPage(){return `<div class="page page-enter">${breadcrumb('Модели и стек')}<div class="page-heading"><div><div class="kicker">ML-ЯДРО</div><h1>Четыре роли.<br><span class="lighter">Один работающий цикл.</span></h1><p>Прогноз свойств, сравнение с baseline, калибровка и выбор эксперимента решают разные задачи. Открывайте карточки, чтобы увидеть назначение.</p></div></div><div class="model-select">${Object.entries(MODELS).map(([id,m])=>`<button data-model="${id}" class="${modelChoice===id?'active':''}">${pill(m.status)}<strong>${m.name}</strong><small>${m.role}</small></button>`).join('')}</div><div id="model-panel" class="model-panel">${modelPanel()}</div><section class="content-block"><h2>Где заканчивается модель и начинается выбор</h2><div class="table-wrap"><table><thead><tr><th>Задача</th><th>В MVP</th><th>Следующий шаг</th></tr></thead><tbody><tr><td><strong>Предсказать свойство</strong></td><td>sklearn GP · Matérn 5/2</td><td>Ridge / CatBoost; затем BoTorch GP</td></tr><tr><td><strong>Оценить интервал</strong></td><td>GP-интервал и split conformal</td><td>Калибровка с учётом групп опытов</td></tr><tr><td><strong>Выбрать опыт</strong></td><td>Monte Carlo expected improvement</td><td>qLogNEI; стоимость и очередь</td></tr><tr><td><strong>Отфильтровать кандидатов</strong></td><td>Границы, линейные неравенства</td><td>Категории и ограничения установки</td></tr><tr><td><strong>Хранить и обслуживать</strong></td><td>FastAPI + SQLite + HTML/JS</td><td>Версии данных и доступы в контуре</td></tr></tbody></table></div></section>${note('Несколько целевых диапазонов не требуют Pareto-оптимизации автоматически. В текущей задаче важно войти в заданные диапазоны всех свойств.')}<section class="content-block"><h2>Для первого реального набора</h2><p class="prose">Один мономер · температура, CT/CM и время пребывания · сначала конверсия. Затем отдельные модели для Mn и дисперсности Đ; согласованный Mw можно получать как Mn × Đ. Все признаки и цели должны описывать одну согласованную экспериментальную постановку.</p></section><div class="support-grid">${['uncertainty','evaluation','runtime'].map(id=>`<button class="support-card" data-open-module="${id}"><div class="support-icon">${icon(id)}</div><div><strong>${M[id].title}</strong><p>${M[id].subtitle}</p></div></button>`).join('')}</div><section class="source-section"><h2>Документация</h2>${refsMarkup([{title:'scikit-learn · Gaussian Processes',url:'https://scikit-learn.org/stable/modules/gaussian_process.html'},{title:'BoTorch · Models and acquisition',url:'https://botorch.org/docs/models'},{title:'CatBoost · Uncertainty',url:'https://catboost.ai/docs/en/references/uncertainty'},{title:'IUPAC · Molar-mass dispersity',url:'https://goldbook.iupac.org/terms/view/12224'}])}</section></div>`;}
const PHASES=[{title:'Работающий программный цикл',done:true,text:'CSV и ручной ввод, GP, подбор кандидатов, искусственный симулятор, обновление истории и локальный интерфейс.',check:'В архиве v0.1.0 — 18 пройденных тестов и воспроизводимый синтетический benchmark.',link:'runtime'}, {title:'Один реальный набор данных',text:'Monash, один мономер, заранее выбранный endpoint. Сохраняем raw-файлы, experiment_id, единицы, протоколы и причины отбраковки.',check:'По каждой строке можно восстановить независимую реакцию и исходное измерение.',link:'data'}, {title:'Сравнение прогнозирующих моделей',text:'Ridge, CatBoost и GP на одинаковых групповых разбиениях. Настройка и обработка признаков выполняются внутри train.',check:'Получены MAE / RMSE на новых экспериментах; отдельно проверены ширина и покрытие интервалов.',link:'gp'}, {title:'Архивная проверка выбора опыта',text:'Алгоритм видит только уже выбранные результаты; новые кандидаты выбираются из конечного пула реально измеренных опытов. Сравниваем с random и согласованным базовым планом.',check:'Нет скрытой утечки меток, неуспехи не исключаются, бюджет считается по независимым экспериментам.',link:'evaluation'}, {title:'Пилот вместе с технологом',text:'Одна марка или узкий процесс, архив заказчика, согласованные границы. Уточняем протокол измерения и начинаем с рекомендаций человеку.',check:'Заранее зафиксированы критерий успеха, baseline, бюджет калибровки и повторов, процедура подтверждения результата.',link:'experiment'}, {title:'Интеграция и эксплуатация',text:'Подключаем LIMS или выгрузки установки, версии данных и моделей, права, резервное копирование и наблюдаемость. Способ аппаратной интеграции выбирается с заказчиком.',check:'Сохраняется полная цепочка «рекомендация → утверждение → опыт → измерение → модель».',link:'storage'}];
function roadmapPage(){return `<div class="page page-enter">${breadcrumb('План пилота')}<div class="page-heading"><div><div class="kicker">СЛЕДУЮЩИЕ ЭТАПЫ</div><h1>От работающего кода<br><span class="lighter">к проверке на установке.</span></h1><p>Этапы заканчиваются конкретным доказательством. Скорость разработки не заменяет проверку на реальных опытах.</p></div></div><div class="phase-list">${PHASES.map((p,i)=>`<section class="phase"><div class="phase-circle ${p.done?'done':''}">${icon(p.done?'check':'circle')}</div><div>${p.done?'<span class="pill done">Сделано · v0.1.0</span>':`<span class="pill plan">${i===1?'Следующий спринт':'Запланировано'}</span>`}<h3>${p.title}</h3><p>${p.text}</p><div class="phase-check"><strong>Критерий готовности:</strong> ${p.check}</div><button class="btn ghost" style="margin-top:14px" data-open-module="${p.link}">${icon('book')}Устройство модуля</button></div></section>`).join('')}</div>${note('Сокращение числа реальных синтезов пока не измерено. Целевые 50–70% экспериментов и ускорение 10–25× из описания программы не являются результатами нашего MVP.')}<button class="btn primary" data-route="map">${icon('map')}Вернуться к архитектуре</button></div>`;}
const SOURCES=[{title:'Исходники MVP v0.1.0',description:'Основа статусов «В MVP»: engine.py, api.py, simulator.py, интерфейс и сохранённые отчёты. Привязки к файлам есть на каждой странице модуля.',url:'#',label:'Архив не опубликован'},{title:'Gaussian Processes · scikit-learn',description:'API регрессора, ядра, шум и оценки неопределённости.',url:'https://scikit-learn.org/stable/modules/gaussian_process.html',label:'Официальная документация'},{title:'BoTorch · Models',description:'SingleTaskGP, ModelListGP и работа с несколькими выходами.',url:'https://botorch.org/docs/models',label:'Официальная документация'},{title:'BoTorch · Closed-loop optimization',description:'Построение цикла и использование qLogEI / qLogNEI.',url:'https://botorch.org/docs/tutorials/closed_loop_botorch_only',label:'Официальный пример'},{title:'CatBoost · Uncertainty',description:'Модельная неопределённость, virtual ensembles и вероятностные потери.',url:'https://catboost.ai/docs/en/references/uncertainty',label:'Официальная документация'},{title:'Conformal prediction',description:'Angelopoulos & Bates: условия обменности и свойства предсказательных интервалов.',url:'https://arxiv.org/abs/2107.07511',label:'Исследовательская статья'},{title:'Иерархические данные и калибровка',description:'Lee, Barber & Willett: распределительно свободный вывод при групповой структуре данных.',url:'https://arxiv.org/abs/2306.06342',label:'Исследовательская статья'},{title:'GroupKFold · scikit-learn',description:'Разбиение, при котором группы не пересекаются между обучением и тестом.',url:'https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.GroupKFold.html',label:'Официальная документация'}];
function sourcesPage(){return `<div class="page page-enter">${breadcrumb('Источники и код')}<div class="page-heading"><div><div class="kicker">ОСНОВА КАРТЫ</div><h1>Проверяемая архитектура.</h1><p>Статусы основаны на локальных исходниках MVP v0.1.0. Будущие компоненты описаны как план, а внешние источники доступны по ссылкам.</p></div></div><div class="sources-grid">${SOURCES.map(s=>`<article class="source-card"><h3>${s.title}</h3><p>${s.description}</p><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${s.label}</a></article>`).join('')}</div><section class="source-section"><h2>Датасеты</h2>${refsMarkup(DATASETS.map(d=>({title:d.name,url:d.url})))}</section><section class="source-section"><h2>Что показывает эта карта</h2><p class="prose">Это интерактивная документация проекта, а не запущенный вычислительный сервис. Карта не обучает модель, не отправляет команды в MVP и не подключается к установке. Код, API и последовательность действий разобраны на страницах модулей.</p></section><section class="source-section"><h2>Как читать статусы</h2><div class="table-wrap"><table><tbody><tr><td>${pill('implemented')}</td><td>Функция присутствует в исходниках. Это не означает промышленную валидацию.</td></tr><tr><td>${pill('mixed')}</td><td>Базовая часть работает; реальная интеграция или проверка ещё впереди.</td></tr><tr><td>${pill('planned')}</td><td>Следующий этап разработки, в текущую версию не входит.</td></tr></tbody></table></div></section><button class="btn" id="download-html">${icon('download')}Скачать эту карту как HTML</button></div>`;}
function route(){closeDrawer(false);if(boardResize){boardResize.disconnect();boardResize=null}const parts=location.hash.replace(/^#\/?/,'').split('/');currentRoute=parts[0]||'map';currentModule=currentRoute==='module'&&M[parts[1]]?parts[1]:null;detailTab=['overview','implementation','contract','next'].includes(parts[2])?parts[2]:'overview';if(currentRoute==='module'&&!currentModule){currentRoute='map';toast('Модуль не найден. Открыта карта проекта.')}let html;if(currentRoute==='module')html=modulePage(currentModule);else if(currentRoute==='datasets')html=datasetsPage();else if(currentRoute==='models')html=modelsPage();else if(currentRoute==='roadmap')html=roadmapPage();else if(currentRoute==='sources')html=sourcesPage();else{currentRoute='map';html=mapPage()}document.getElementById('main-content').innerHTML=html;renderSidebar();closeMobileNav();document.title=(currentModule?M[currentModule].title:({map:'Карта проекта',datasets:'Данные для обучения',models:'Модели и стек',roadmap:'План пилота',sources:'Источники и код'}[currentRoute]))+' — PolySearch';if(currentRoute==='map')setupMap();document.getElementById('main-content').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
function go(routeName){const h='#/'+routeName;if(location.hash===h){route()}else location.hash=h;}
function closeMobileNav(){document.getElementById('sidebar').classList.remove('open');document.getElementById('nav-backdrop').classList.remove('open');document.getElementById('menu-toggle').setAttribute('aria-expanded','false');}
function openSearch(){lastFocus=document.activeElement;document.getElementById('search-overlay').hidden=false;document.getElementById('search-input').value='';renderSearch('');requestAnimationFrame(()=>document.getElementById('search-input').focus())}
function closeSearch(){document.getElementById('search-overlay').hidden=true;if(lastFocus?.isConnected)lastFocus.focus({preventScroll:true})}
function renderSearch(q){q=q.toLowerCase().trim();const records=MODULES.map(m=>({title:m.title,subtitle:m.subtitle,id:m.id,status:m.status,route:'module/'+m.id,text:[m.title,m.subtitle,m.purpose,...m.implemented,...m.planned,...m.files.map(f=>f.path+' '+f.symbol)].join(' ').toLowerCase()})).concat(DATASETS.map(d=>({title:d.name,subtitle:d.description,id:'data',status:'planned',route:'datasets',text:[d.name,d.about,d.x,d.y,'датасеты'].join(' ').toLowerCase()})));const rows=records.filter(r=>!q||r.text.includes(q));document.getElementById('search-results').innerHTML=rows.length?rows.map(r=>`<button class="search-result" data-search-route="${r.route}">${icon(r.id)}<div><strong>${esc(r.title)}</strong><p>${esc(r.subtitle)}</p></div>${pill(r.status)}</button>`).join(''):'<div class="empty">Ничего не найдено. Попробуйте «GP», «CSV» или «Monash».</div>';}
async function copyText(text){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}else{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();if(!document.execCommand('copy'))throw new Error('copy');t.remove()}toast('Скопировано')}catch{toast('Не удалось скопировать. Выделите текст вручную.')}}
function downloadHTML(){const clone=document.documentElement.cloneNode(true);clone.querySelector('#main-content').innerHTML='';clone.querySelector('#sidebar').innerHTML='';clone.querySelector('#drawer').innerHTML='';clone.querySelector('#drawer').classList.remove('open');clone.querySelector('#search-overlay').setAttribute('hidden','');clone.querySelector('#toast').textContent='';clone.querySelector('#toast').classList.remove('show');const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='syurai-project-map.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('HTML-карта подготовлена для скачивания')}
document.addEventListener('click',e=>{const t=e.target.closest('button,a');if(!t)return;if(t.classList.contains('skip-link')){e.preventDefault();document.getElementById('main-content').focus();return}if(t.dataset.route){e.preventDefault();go(t.dataset.route)}else if(t.dataset.openModule){go('module/'+t.dataset.openModule)}else if(t.dataset.node){if(walkIndex>=0){walkIndex=-1;showWalk()}openDrawer(t.dataset.node)}else if(t.dataset.filter){filter=t.dataset.filter;applyMapState()}else if(t.dataset.view){viewMode=t.dataset.view;setMapView()}else if(t.dataset.detailTab){detailTab=t.dataset.detailTab;history.replaceState(null,'','#/module/'+currentModule+'/'+detailTab);document.querySelectorAll('[data-detail-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.detailTab===detailTab);b.setAttribute('aria-current',b.dataset.detailTab===detailTab?'page':'false')});document.getElementById('detail-content').innerHTML=detailContent(M[currentModule]);}else if(t.dataset.model){modelChoice=t.dataset.model;document.querySelectorAll('[data-model]').forEach(b=>b.classList.toggle('active',b.dataset.model===modelChoice));document.getElementById('model-panel').innerHTML=modelPanel()}else if(t.dataset.walk){if(t.dataset.walk==='next'){walkIndex=walkIndex===walkthrough.length-1?-1:walkIndex+1}else if(t.dataset.walk==='prev'){walkIndex=Math.max(0,walkIndex-1)}else{walkIndex=-1}showWalk()}else if(t.dataset.searchRoute){closeSearch();go(t.dataset.searchRoute)}else if(t.hasAttribute('data-copy-code')){copyText(t.closest('.code-block').querySelector('code').textContent)}else if(t.dataset.copyPath){copyText(t.dataset.copyPath)}else if(t.id==='download-html'){downloadHTML()}});
document.getElementById('search-open').onclick=openSearch;document.getElementById('search-close').onclick=closeSearch;document.getElementById('search-input').oninput=e=>renderSearch(e.target.value);document.getElementById('search-overlay').addEventListener('click',e=>{if(e.target===document.getElementById('search-overlay'))closeSearch()});document.getElementById('menu-toggle').onclick=()=>{const isOpen=document.getElementById('sidebar').classList.toggle('open');document.getElementById('nav-backdrop').classList.toggle('open',isOpen);document.getElementById('menu-toggle').setAttribute('aria-expanded',String(isOpen))};document.getElementById('nav-backdrop').onclick=closeMobileNav;
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape'){if(!document.getElementById('search-overlay').hidden){closeSearch();return}if(document.getElementById('drawer').classList.contains('open')){closeDrawer();return}const full=document.getElementById('canvas-wrap');if(full?.classList.contains('maximized')){full.classList.remove('maximized');requestAnimationFrame(fitMap)}else if(walkIndex>=0){walkIndex=-1;showWalk()}closeMobileNav()}if(!document.getElementById('search-overlay').hidden){if(e.key==='Enter'&&document.activeElement===document.getElementById('search-input')){e.preventDefault();document.querySelector('.search-result')?.click()}if(e.key==='Tab'){const els=[...document.getElementById('search-overlay').querySelectorAll('input,button')],first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}});
document.getElementById('search-icon').innerHTML=icon('search');document.getElementById('modal-search-icon').innerHTML=icon('search');document.getElementById('search-close').innerHTML=icon('close');document.getElementById('menu-toggle').innerHTML=icon('menu');document.getElementById('drawer').inert=true;window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
