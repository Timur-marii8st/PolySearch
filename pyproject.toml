[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polysearch"
version = "0.1.0"
description = "Experimental design and Bayesian optimization for polymer research"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.3.5",
  "scipy==1.17.0",
  "scikit-learn==1.8.0",
  "pydantic==2.13.5",
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "httpx==0.28.1", "catboost==1.2.8"]
ml = ["catboost==1.2.8", "openpyxl==3.1.5"]

[tool.setuptools.packages.find]
include = ["polysearch*"]

[tool.setuptools.package-data]
polysearch = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
