[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polysearch"
version = "1.0.0b1"
description = "Experimental design and Bayesian optimization for polymer research"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.3.5",
  "scipy==1.17.0",
  "scikit-learn==1.8.0",
  "pydantic==2.13.5",
  "fastapi==0.165.0",
  "starlette==1.10.0",
  "uvicorn==0.48.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "httpx==0.28.1", "catboost==1.2.8"]
ml = ["catboost==1.2.8", "openpyxl==3.1.5"]
server = ["psycopg[binary]==3.2.10"]

[tool.setuptools.packages.find]
include = ["polysearch*"]

[tool.setuptools.package-data]
polysearch = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
